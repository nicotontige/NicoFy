on: workflow_dispatch
name: Test, Build and Pre Release apk
env:
  PROPERTIES_PATH: "./android/key.properties"
jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5
    # Setup Java environment in order to build the Android app.
    - uses: actions/setup-java@v5
      with:
        distribution: 'zulu'
        java-version: '17.x'
    # Gradle cache for faster builds
    - uses: actions/cache@v5
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
        key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*') }}
        restore-keys: |
          ${{ runner.os }}-gradle-
    # Setup the flutter environment.
    - uses: subosito/flutter-action@v2
      with:
        channel: "stable"

    #
    - name: Restore signing key
      env:
        KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      run: |
        echo "$KEYSTORE_BASE64" | base64 --decode > android/app/key.jks
        {
          echo "storePassword=$KEYSTORE_PASSWORD"
          echo "keyAlias=$KEY_ALIAS"
          echo "keyPassword=$KEY_PASSWORD"
        } > "$PROPERTIES_PATH"

    # Get flutter dependencies.
    - run: flutter pub get
    # Statically analyze the Dart code for any errors.
    - run: flutter analyze .
     # Build arm64 APK for GitHub pre-release
    - name: Build arm64 APK
      run: flutter build apk --release --split-per-abi --target-platform="android-arm64" --flavor github
    # Pre-release arm64 generated APK
    - name: Release arm64 APK
      uses: svenstaro/upload-release-action@v2
      with:
        repo_name: nicotontige/NicoFy
        repo_token: ${{ secrets.GITHUB_TOKEN }}
        file: build/app/outputs/flutter-apk/app-arm64-v8a-github-release.apk
        asset_name: NicoFy-arm64-v8a.apk
        tag: ${{ github.ref }}
        prerelease: true
        overwrite: true
        body: "**New NicoFy Pre-Release!** \n
        with pre-release / [BETA] builds you have access to the latest build of the app before it is released as stable-release version. Please note that pre-release versions of the app may be pretty unstable. You may experience crashes, bugs, or other issues while using the app. This is because pre-release version is still in development.
        "