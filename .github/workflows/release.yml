name: Build and release apk

# A release is cut by pushing a tag named after the version in pubspec.yaml,
# e.g. `git tag 1.0.0 && git push origin 1.0.0`. The desktop workflow runs on
# the same tag and adds its bundles to the same release.
on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: write

env:
  PROPERTIES_PATH: './android/key.properties'

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Check the tag matches pubspec.yaml
        id: version
        run: |
          version="${GITHUB_REF_NAME}"
          pubspec=$(grep -oP '^version: \K[0-9]+\.[0-9]+\.[0-9]+' pubspec.yaml)
          build=$(grep -oP '^version: [0-9.]+\+\K[0-9]+' pubspec.yaml)
          if [[ "$version" != "$pubspec" ]]; then
            echo "Tag $version does not match pubspec.yaml version $pubspec" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "build=$build" >> "$GITHUB_OUTPUT"

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17.x'

      - name: Cache Gradle dependencies
        uses: actions/cache@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - run: |
          pip install -U yq
          echo "FLUTTER_VERSION=$(yq -r .environment.flutter pubspec.yaml | sed 's/\^//g')" >> $GITHUB_ENV
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: "${{ env.FLUTTER_VERSION }}"

      # The release keystore, kept in the repository secrets.
      - name: Restore signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > android/app/key.jks
          {
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > "$PROPERTIES_PATH"

      - name: Get Flutter dependencies
        run: flutter pub get

      - name: Analyze Dart code
        run: flutter analyze .

      - name: Build arm64 APK
        run: flutter build apk --release --split-per-abi --target-platform="android-arm64" --flavor github

      - name: Build universal APK
        run: flutter build apk --release --flavor github

      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version="${{ steps.version.outputs.version }}"
          notes="fastlane/metadata/android/en-US/changelogs/${{ steps.version.outputs.build }}.txt"
          [[ -f "$notes" ]] || { echo "NicoFy $version" > release-notes.md; notes=release-notes.md; }
          cp build/app/outputs/flutter-apk/app-arm64-v8a-github-release.apk NicoFy-arm64-v8a.apk
          cp build/app/outputs/flutter-apk/app-github-release.apk NicoFy.apk
          # The desktop workflow may have created the release first.
          if gh release view "$version" > /dev/null 2>&1; then
            gh release edit "$version" --title "NicoFy $version" --notes-file "$notes" --prerelease=false
            gh release upload "$version" NicoFy.apk NicoFy-arm64-v8a.apk --clobber
          else
            gh release create "$version" NicoFy.apk NicoFy-arm64-v8a.apk \
              --title "NicoFy $version" --notes-file "$notes"
          fi

      # The app reads check.json on the `update` branch to learn that a new
      # version exists. An announcement URL already set there is kept.
      - name: Point update checks at this release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version="${{ steps.version.outputs.version }}"
          base="https://github.com/${GITHUB_REPOSITORY}/releases/download/${version}"
          announcement=$(curl -fsSL "https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/update/check.json" | jq -c '.announcementurl' 2>/dev/null || true)
          mkdir update-branch && cd update-branch
          git init -q -b update
          jq -n --arg v "$version" --arg u "$base/NicoFy.apk" --arg a "$base/NicoFy-arm64-v8a.apk" \
            --argjson ann "${announcement:-null}" \
            '{version: $v, url: $u, arm64url: $a, announcementurl: $ann}' > check.json
          git add check.json
          git -c user.name='github-actions[bot]' \
              -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
              commit -qm "Update: v${version}"
          git push -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" update
