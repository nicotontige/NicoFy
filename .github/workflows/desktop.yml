name: Desktop builds

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
            artifact: build/nicofy-linux-x64.tar.gz
          - os: windows-latest
            platform: windows
            artifact: build/nicofy-windows-x64.zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libmpv-dev pulseaudio xvfb
      - name: Resolve Flutter version
        shell: bash
        run: |
          echo "FLUTTER_VERSION=$(sed -n 's/^  flutter: \^*//p' pubspec.yaml)" >> "$GITHUB_ENV"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
      - run: flutter pub get
      - run: flutter analyze
      - name: Test Windows Runtime initialization
        if: runner.os == 'Windows'
        run: |
          cmake -S test/windows/runtime -B build/windows-runtime-test -A x64
          cmake --build build/windows-runtime-test --config Release
          ctest --test-dir build/windows-runtime-test -C Release --output-on-failure
      - run: flutter build ${{ matrix.platform }} --release
      - name: Test native playback
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == "Linux" ]]; then
            pulseaudio --start --exit-idle-time=-1
            pactl load-module module-null-sink sink_name=nicofy-test
            export NICOFY_TEST_LIBMPV=/usr/lib/x86_64-linux-gnu/libmpv.so.2
          else
            export NICOFY_TEST_LIBMPV="$(pwd)/build/windows/x64/runner/Release/libmpv-2.dll"
          fi
          flutter test test/desktop/audio_native_test.dart test/desktop/media_handler_native_test.dart
      - name: Check Linux startup
        if: runner.os == 'Linux'
        run: dbus-run-session -- xvfb-run -a python .github/scripts/check_desktop_startup.py build/linux/x64/release/bundle/nicofy
      - name: Check Windows startup
        if: runner.os == 'Windows'
        run: python .github/scripts/check_desktop_startup.py build/windows/x64/runner/Release/nicofy.exe
      - name: Check Windows icons
        if: runner.os == 'Windows'
        run: python .github/scripts/check_windows_icons.py build/windows/x64/runner/Release/nicofy.exe
      - name: Archive Linux bundle
        if: runner.os == 'Linux'
        run: tar -czf build/nicofy-linux-x64.tar.gz -C build/linux/x64/release/bundle .
      - name: Archive Windows bundle
        if: runner.os == 'Windows'
        run: Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath build/nicofy-windows-x64.zip
      - name: Extract version
        id: extract_version
        shell: bash
        env:
          REF_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          echo "version=$REF_NAME" >> "$GITHUB_OUTPUT"
          [[ "$REF_TYPE" == tag ]] && echo "prerelease=false" >> "$GITHUB_OUTPUT" || echo "prerelease=true" >> "$GITHUB_OUTPUT"
      # Whichever workflow finishes first creates the release, so the notes have
      # to be given here too, or a release whose APK build failed stays blank.
      - name: Read release notes
        id: notes
        shell: bash
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          build=$(grep -E '^version:' pubspec.yaml | sed -E 's/^version: *[^+]+\+([0-9]+).*/\1/')
          notes="fastlane/metadata/android/en-US/changelogs/${build}.txt"
          {
            echo 'body<<NICOFY_NOTES_EOF'
            if [[ -f "$notes" ]]; then cat "$notes"; else echo "NicoFy $REF_NAME"; fi
            echo 'NICOFY_NOTES_EOF'
          } >> "$GITHUB_OUTPUT"
      - name: Release desktop bundle
        uses: svenstaro/upload-release-action@v2
        with:
          release_name: NicoFy ${{ steps.extract_version.outputs.version }}
          body: ${{ steps.notes.outputs.body }}
          repo_name: nicotontige/NicoFy
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: ${{ matrix.artifact }}
          asset_name: NicoFy-${{ matrix.platform }}-x64.${{ matrix.platform == 'linux' && 'tar.gz' || 'zip' }}
          tag: ${{ steps.extract_version.outputs.version }}
          prerelease: ${{ steps.extract_version.outputs.prerelease }}
          overwrite: true
